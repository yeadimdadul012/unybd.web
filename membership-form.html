<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Form - UNYBD</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 bg-cover bg-center bg-no-repeat pb-20 text-gray-800 sm:pb-0" style="background-image: url('bg logo.jpeg');">
    <!-- Desktop Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="mx-auto hidden max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:flex sm:px-6 lg:px-8">
            <div class="flex items-center">
                <img src="uddami logo.jpeg" alt="Logo" class="h-20 sm:h-24 md:h-28 lg:h-32">
            </div>
            <ul class="flex w-full items-center justify-center gap-5 text-center sm:w-auto md:gap-8">
                <li><a href="index.html" class="block rounded px-2 py-1 text-sm font-medium text-red-600 transition hover:text-red-700 sm:text-base">Home</a></li>
                <li><a href="membership-form.html" class="block rounded px-2 py-1 text-sm font-medium text-red-600 transition hover:text-red-700 sm:text-base">Membership Form</a></li>
                <li><a href="members.html" class="block rounded px-2 py-1 text-sm font-medium text-red-600 transition hover:text-red-700 sm:text-base">Members</a></li>
            </ul>
        </div>

        <!-- Mobile Header -->
        <div class="flex items-center justify-between bg-white px-3 py-3 shadow-md sm:hidden">
            <div class="flex items-center">
                <img src="uddami logo.jpeg" alt="Logo" class="h-14 w-auto">
            </div>

            <button id="mobile-menu-button" type="button" aria-label="Toggle menu" aria-expanded="false" class="flex h-11 w-11 items-center justify-center rounded-lg border border-gray-200 bg-white shadow-sm">
                <span class="relative block h-5 w-5">
                    <span class="absolute left-0 top-0 block h-0.5 w-5 rounded bg-red-600"></span>
                    <span class="absolute left-0 top-2 block h-0.5 w-5 rounded bg-red-600"></span>
                    <span class="absolute left-0 top-4 block h-0.5 w-5 rounded bg-red-600"></span>
                </span>
            </button>
        </div>

        <div id="mobile-menu" class="mt-0 hidden flex-col gap-2 border-t border-gray-200 bg-white p-3 shadow-sm sm:hidden">
            <a href="index.html" class="rounded-lg px-3 py-2 text-sm font-semibold text-red-600 transition hover:bg-red-50">Home</a>
            <a href="membership-form.html" class="rounded-lg px-3 py-2 text-sm font-semibold text-red-600 transition hover:bg-red-50">Membership Form</a>
            <a href="members.html" class="rounded-lg px-3 py-2 text-sm font-semibold text-red-600 transition hover:bg-red-50">Members</a>
        </div>
    </nav>

    <!-- Membership Form Content -->
    <div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 px-4 py-8 sm:px-6 md:py-16 lg:px-8">
        <div class="mx-auto max-w-2xl">
            <div class="rounded-xl bg-white p-5 shadow-lg sm:p-6 md:rounded-2xl md:p-10 md:shadow-2xl">
                <div class="mb-8 text-center md:mb-10">
                    <h2 class="mb-2 text-2xl font-bold text-gray-900 md:mb-3 md:text-4xl">Membership Application</h2>
                    <p class="text-sm text-gray-600 md:text-base">Join UNYBD and become part of our community</p>
                    <div class="mx-auto mt-3 h-1 w-16 rounded-full bg-red-600 md:mt-4"></div>
                </div>

                <form class="space-y-4 md:space-y-6">
                    <div>
                        <label class="mb-2 block text-sm font-semibold text-gray-800 md:mb-3 md:text-base">Full Name <span class="text-red-600">*</span></label>
                        <input type="text" placeholder="Enter your full name" class="w-full rounded-lg border-2 border-gray-200 bg-gray-50 px-3 py-2.5 text-sm transition focus:border-red-600 focus:outline-none md:px-5 md:py-3 md:text-base" required>
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-semibold text-gray-800 md:mb-3 md:text-base">Email <span class="text-red-600">*</span></label>
                        <input type="email" placeholder="Enter your email" class="w-full rounded-lg border-2 border-gray-200 bg-gray-50 px-3 py-2.5 text-sm transition focus:border-red-600 focus:outline-none md:px-5 md:py-3 md:text-base" required>
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-semibold text-gray-800 md:mb-3 md:text-base">Phone <span class="text-red-600">*</span></label>
                        <input type="tel" placeholder="Enter your phone number" class="w-full rounded-lg border-2 border-gray-200 bg-gray-50 px-3 py-2.5 text-sm transition focus:border-red-600 focus:outline-none md:px-5 md:py-3 md:text-base" required>
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-semibold text-gray-800 md:mb-3 md:text-base">Institution <span class="text-red-600">*</span></label>
                        <input type="text" placeholder="Enter your institution/school/college" class="w-full rounded-lg border-2 border-gray-200 bg-gray-50 px-3 py-2.5 text-sm transition focus:border-red-600 focus:outline-none md:px-5 md:py-3 md:text-base" required>
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-semibold text-gray-800 md:mb-3 md:text-base">Class <span class="text-red-600">*</span></label>
                        <select class="w-full rounded-lg border-2 border-gray-200 bg-gray-50 px-3 py-2.5 text-sm transition focus:border-red-600 focus:outline-none md:px-5 md:py-3 md:text-base" required>
                            <option value="">Select your class</option>
                            <option value="6">Class 6</option>
                            <option value="7">Class 7</option>
                            <option value="8">Class 8</option>
                            <option value="9">Class 9</option>
                            <option value="10">Class 10</option>
                            <option value="11">Class 11</option>
                            <option value="12">Class 12</option>
                        </select>
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-semibold text-gray-800 md:mb-3 md:text-base">Address</label>
                        <textarea placeholder="Enter your address" class="w-full rounded-lg border-2 border-gray-200 bg-gray-50 px-3 py-2.5 text-sm transition focus:border-red-600 focus:outline-none md:px-5 md:py-3 md:text-base" rows="3"></textarea>
                    </div>

                    <button type="submit" class="mt-6 w-full rounded-lg bg-gradient-to-r from-red-600 to-red-700 py-3 text-sm font-bold text-white shadow-lg transition hover:from-red-700 hover:to-red-800 md:mt-8 md:py-4 md:text-base">Submit Application</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
